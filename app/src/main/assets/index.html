<!doctype html><html lang="he" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;background:#020513;color:white;font-family:Arial;overflow:hidden}canvas{display:block;touch-action:none}#ui{position:fixed;top:12px;right:15px;left:15px;display:flex;justify-content:space-between;font-size:18px;font-weight:900;text-shadow:0 0 12px cyan;pointer-events:none}#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020513cc;text-align:center}#box{border:2px solid #08f7ff;box-shadow:0 0 50px #00edff77;background:#080f29;border-radius:22px;padding:30px;max-width:540px}h1{font-size:42px;color:#4ff;text-shadow:0 0 22px cyan}button{background:#121b42;color:white;border:2px solid cyan;border-radius:12px;padding:12px 22px;font-size:20px;margin:6px;box-shadow:0 0 16px #0ff5}#stick{position:fixed;left:35px;bottom:25px;width:115px;height:115px;border:2px solid #0ff9;border-radius:100%;background:#00ffff20;touch-action:none}#dot{position:absolute;left:35px;top:35px;width:42px;height:42px;border-radius:100%;background:#2effffab}small{color:#9ab}</style><canvas id="c"></canvas><div id="ui"><span id="score">⚡ 0</span><span id="stage">שלב 1</span><span id="hp">❤️ 100</span><span id="best">🏆 0</span></div><div id="stick"><div id="dot"></div></div><div id="menu"><div id="box"><h1>⚡ NEON ROBOT ARENA</h1><p id="msg">קרבות רובוטים, שלבים ושדרוגי נשקים. זזים והנשק יורה אוטומטית!</p><div id="choices"></div><button id="go">התחל משחק</button><p><small>ללא אינטרנט • ללא חשבון • ללא פרסומות</small></p></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),el=id=>document.getElementById(id);let w,h,p,E=[],B=[],F=[],heal=[],lv=1,k=0,goal=12,score=0,best=+(localStorage.getItem('nrbest')||0),run=false,pause=false,spawn=0,shoot=0,last=0,rate=.31,dmg=1,multi=1,spd=250,inv=0;el('best').textContent='🏆 '+best;
function size(){w=c.width=innerWidth;h=c.height=innerHeight}onresize=size;size();let keys={},stick={x:0,y:0};onkeydown=e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Escape'||e.key.toLowerCase()==='p')togglePause()};onkeyup=e=>keys[e.key.toLowerCase()]=0;
let pad=el('stick'),dot=el('dot');pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(e.buttons)move(e)};pad.onpointerup=pad.onpointercancel=()=>{stick.x=stick.y=0;dot.style.transform=''};function move(e){e.preventDefault();let r=pad.getBoundingClientRect(),x=e.clientX-r.left-57,y=e.clientY-r.top-57,l=Math.max(1,Math.hypot(x,y));stick.x=x/l*Math.min(1,l/42);stick.y=y/l*Math.min(1,l/42);dot.style.transform='translate('+stick.x*39+'px,'+stick.y*39+'px)'}
function start(){p={x:w/2,y:h/2,hp:100,max:100,r:14};E=[];B=[];F=[];heal=[];lv=1;k=score=0;goal=12;spawn=shoot=inv=0;rate=.31;dmg=multi=1;spd=250;run=true;pause=false;el('menu').style.display='none'}el('go').onclick=start;
function togglePause(){if(!run)return;pause=!pause;el('menu').style.display=pause?'flex':'none';el('msg').textContent='המשחק מושהה';el('choices').innerHTML='';el('go').style.display='inline-block';el('go').textContent='המשך';el('go').onclick=()=>{pause=false;el('menu').style.display='none'}}
function rand(a,b){return a+Math.random()*(b-a)}function sparks(x,y,col,n){for(let i=0;i<n;i++){let a=rand(0,7),s=rand(25,190);F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:rand(.2,.6),col})}}
function wave(){pause=true;lv++;k=0;goal=12+lv*5;p.hp=Math.min(p.max,p.hp+25);el('msg').textContent='הגעת לשלב '+lv+'! בחר שדרוג:';el('go').style.display='none';let ch=el('choices');ch.innerHTML='';let arr=[['🔫 ירי מהיר',()=>rate=Math.max(.08,rate*.78)],['💥 עוצמת ירי',()=>dmg++],['🛡️ תוספת חיים',()=>{p.max+=30;p.hp=Math.min(p.max,p.hp+60)}],['⚡ מהירות',()=>spd+=40],['🎯 עוד קליעים',()=>multi=Math.min(5,multi+1)]];arr.sort(()=>Math.random()-.5).slice(0,3).forEach(([t,fn])=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{fn();pause=false;el('menu').style.display='none'};ch.append(b)});el('menu').style.display='flex'}
function gameover(){run=false;if(score>best){best=score;localStorage.setItem('nrbest',best)}el('msg').textContent='המשחק הסתיים! ניקוד '+score+' | שיא '+best;el('choices').innerHTML='';el('go').style.display='inline-block';el('go').textContent='שחק שוב';el('go').onclick=start;el('menu').style.display='flex'}
function tick(dt){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+stick.y,l=Math.max(1,Math.hypot(x,y));p.x=Math.max(16,Math.min(w-16,p.x+x/l*spd*dt));p.y=Math.max(16,Math.min(h-16,p.y+y/l*spd*dt));spawn-=dt;shoot-=dt;inv-=dt;if(spawn<=0&&E.length<65){let side=Math.floor(rand(0,4)),big=Math.random()<.14;E.push({x:side===0?-30:side===1?w+30:rand(0,w),y:side===2?-30:side===3?h+30:rand(0,h),r:big?21:13,hp:big?3+lv:1+Math.floor(lv/4),speed:(big?55:91)+lv*5,col:big?'#fc2cbb':'#ff486a'});spawn=Math.max(.22,.85-lv*.045)}
if(shoot<=0&&E.length){let e=E.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<Math.hypot(b.x-p.x,b.y-p.y)?a:b),a=Math.atan2(e.y-p.y,e.x-p.x);for(let i=0;i<multi;i++){let ang=a+(i-(multi-1)/2)*.16;B.push({x:p.x,y:p.y,vx:Math.cos(ang)*590,vy:Math.sin(ang)*590,t:1.4})}shoot=rate}
for(const e of E){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+13&&inv<=0){p.hp-=e.r>15?22:12;inv=.6;sparks(p.x,p.y,'cyan',13);if(p.hp<=0){p.hp=0;gameover();return}}}
for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;for(const e of E)if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){e.hp-=dmg;b.t=0;sparks(b.x,b.y,'#ffe45f',5);if(e.hp<=0){score+=e.r>15?30:10;k++;sparks(e.x,e.y,e.col,17);if(Math.random()<.08)heal.push({x:e.x,y:e.y});if(k>=goal){wave();break}}break}}
E=E.filter(e=>e.hp>0);B=B.filter(b=>b.t>0);heal=heal.filter(a=>{if(Math.hypot(a.x-p.x,a.y-p.y)<24){p.hp=Math.min(p.max,p.hp+20);sparks(a.x,a.y,'#44ffa5',12);return false}return true});F.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.t-=dt});F=F.filter(f=>f.t>0);el('score').textContent='⚡ '+score;el('stage').textContent='שלב '+lv;el('hp').textContent='❤️ '+Math.ceil(p.hp);el('best').textContent='🏆 '+Math.max(best,score)}
function draw(t){g.fillStyle='#030713';g.fillRect(0,0,w,h);g.strokeStyle='#10314d';g.lineWidth=1;let off=t*.012%54;for(let x=off;x<w;x+=54){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=off;y<h;y+=54){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}g.shadowBlur=20;for(const a of heal){g.fillStyle='#4f9';g.shadowColor='#4f9';g.fillRect(a.x-8,a.y-8,16,16)}for(const b of B){g.fillStyle='#ffe25c';g.shadowColor='#ffe25c';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}for(const e of E){g.fillStyle=e.col;g.shadowColor=e.col;g.save();g.translate(e.x,e.y);g.rotate(Math.atan2(p.y-e.y,p.x-e.x));g.fillRect(-e.r,-e.r,e.r*2,e.r*2);g.fillStyle='#080e24';g.fillRect(0,-e.r*.6,e.r*.8,5);g.fillRect(0,e.r*.3,e.r*.8,5);g.restore()}if(p){g.save();g.translate(p.x,p.y);g.fillStyle=inv>0&&Math.floor(inv*15)%2?'white':'#00eeff';g.shadowColor='cyan';g.beginPath();g.moveTo(20,0);g.lineTo(-12,-13);g.lineTo(-7,0);g.lineTo(-12,13);g.closePath();g.fill();g.restore()}for(const f of F){g.globalAlpha=Math.min(1,f.t*2);g.fillStyle=f.col;g.shadowColor=f.col;g.fillRect(f.x,f.y,4,4)}g.globalAlpha=1;g.shadowBlur=0}
function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(run&&!pause)tick(dt);draw(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(document.hidden&&run&&!pause)togglePause()});
</script></html>
